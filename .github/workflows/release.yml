name: Build & Release Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # needed to create the Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download & unpack ffmpeg (essentials)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg_bin | Out-Null
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName ffmpeg_bin\ffmpeg.exe
          $probe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $probe.FullName ffmpeg_bin\ffprobe.exe

      - name: Build with PyInstaller
        run: pyinstaller MMBpm.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMBpm-windows
          path: dist/MMBpm.exe

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MMBpm.exe
          generate_release_notes: true
